<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#f5f7fb;font-family:Lato,sans-serif}body{min-height:100vh;background:radial-gradient(circle at 15% 5%,rgba(67,211,255,.15),transparent 28%),radial-gradient(circle at 86% 8%,rgba(244,91,221,.13),transparent 30%),linear-gradient(#02040a,#050914 55%,#020309)}
.wrap{width:min(100%,680px);margin:auto;padding:12px 12px 30px}.card{border:1px solid rgba(190,211,236,.28);border-radius:22px;padding:16px;background:linear-gradient(180deg,rgba(14,20,32,.96),rgba(4,7,13,.98));box-shadow:0 24px 70px rgba(0,0,0,.5)}

#roulette3d{position:absolute;inset:0;z-index:2}#roulette3d canvas{display:block;width:100%!important;height:100%!important}.stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 -38px 80px rgba(0,0,0,.3)}

</head>
<body><div class="wrap"><section class="card"><div class="meta"><div><div class="song">Don't Stop Believin'</div><div class="artist">Journey</div></div><div class="price">$5</div></div><div class="label"><b>Step 1</b> — What's your name?</div><input class="name" placeholder="So I can give you a shout-out on the mic!"><div class="label"><b>Step 2</b> — Spin the roulette for a chance to win</div><div class="copy">The ball circles the outer rail, drops into the wheel and lands on <span class="f">F for FREE</span> or <span class="b">B for BOGO</span>.</div><div class="stage" id="stage"><img class="scene" src="https://raw.githubusercontent.com/saxmanrp-cmd/rickparma-site/agent/roulette-preview/song-request/croupier-action.webp" alt="Vegas croupier scene"><div id="roulette3d"></div></div><button class="spin" id="spin">Spin to Win</button><div class="result" id="result"></div></section></div>
<script type="module">
import * as THREE from 'three';
const host=document.getElementById('roulette3d'),stage=document.getElementById('stage'),btn=document.getElementById('spin'),result=document.getElementById('result');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.1,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbfdcff,0x14070b,1.05));const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-3,7,5);scene.add(key);const c=new THREE.PointLight(0x55dcff,27,15,2);c.position.set(-5,3,3);scene.add(c);const m=new THREE.PointLight(0xf45bdd,24,15,2);m.position.set(5,3,2);scene.add(m);
const wheel=new THREE.Group();scene.add(wheel);const chrome=new THREE.MeshPhysicalMaterial({color:0xd3d9e0,metalness:1,roughness:.16,clearcoat:1}),dark=new THREE.MeshPhysicalMaterial({color:0x11151c,metalness:.9,roughness:.22,clearcoat:1}),wood=new THREE.MeshPhysicalMaterial({color:0x54220f,roughness:.28,clearcoat:.9}),red=new THREE.MeshPhysicalMaterial({color:0x78101a,roughness:.3,clearcoat:.8}),black=new THREE.MeshPhysicalMaterial({color:0x080a0e,roughness:.32,clearcoat:.75});
function cyl(a,b,h,y,mat,s=96){const x=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,s),mat);x.position.y=y;wheel.add(x);return x}function tor(r,t,y,mat){const x=new THREE.Mesh(new THREE.TorusGeometry(r,t,24,128),mat);x.rotation.x=Math.PI/2;x.position.y=y;wheel.add(x);return x}
cyl(3.48,3.54,.42,.12,dark);cyl(3.33,3.42,.24,.38,chrome);cyl(3.18,3.30,.31,.51,wood);tor(3.25,.17,.68,chrome);tor(2.96,.085,.71,dark);tor(2.72,.06,.72,chrome);
const N=20,STEP=Math.PI*2/N,pockets=new THREE.Group();wheel.add(pockets);function wedge(ri,ro,a0,a1){const s=new THREE.Shape(),n=8;s.moveTo(Math.cos(a0)*ro,Math.sin(a0)*ro);for(let i=1;i<=n;i++){const a=a0+(a1-a0)*i/n;s.lineTo(Math.cos(a)*ro,Math.sin(a)*ro)}for(let i=n;i>=0;i--){const a=a0+(a1-a0)*i/n;s.lineTo(Math.cos(a)*ri,Math.sin(a)*ri)}s.closePath();const g=new THREE.ExtrudeGeometry(s,{depth:.11,bevelEnabled:true,bevelSize:.014,bevelThickness:.014});g.rotateX(-Math.PI/2);return g}function label(t,col){const cv=document.createElement('canvas');cv.width=256;cv.height=128;const x=cv.getContext('2d');x.shadowColor=col;x.shadowBlur=18;x.fillStyle='white';x.font='900 82px Lato';x.textAlign='center';x.textBaseline='middle';x.fillText(t,128,64);const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false}));sp.scale.set(.47,.235,1);return sp}for(let i=0;i<N;i++){const a0=i*STEP+.014,a1=(i+1)*STEP-.014,p=new THREE.Mesh(wedge(2.24,2.67,a0,a1),i%2?red:black);p.position.y=.72;pockets.add(p);const md=(a0+a1)/2,l=label(i%2?'B':'F',i%2?'#ff78e5':'#62e4ff');l.position.set(Math.cos(md)*2.46,.89,-Math.sin(md)*2.46);pockets.add(l)}tor(2.18,.06,.74,chrome);cyl(2.09,2.24,.25,.6,wood);const bowl=new THREE.Mesh(new THREE.CylinderGeometry(.58,1.98,.56,96),wood);bowl.position.y=.9;wheel.add(bowl);tor(1.95,.05,1.1,dark);cyl(.39,.43,.68,1.32,chrome,64);cyl(.21,.33,.43,1.86,dark,64);const cap=new THREE.Mesh(new THREE.SphereGeometry(.28,48,32),chrome);cap.scale.y=.77;cap.position.y=2.17;wheel.add(cap);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.12,40,28),new THREE.MeshPhysicalMaterial({color:0xf7f1e7,roughness:.15,clearcoat:1}));scene.add(ball);let wa=0,ba=.6,br=3.11,anim=null,spinning=false;const eo=t=>1-Math.pow(1-t,5),ei=t=>t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2;function posBall(){ball.position.set(Math.cos(ba)*br,.95,-Math.sin(ba)*br)}posBall();
function begin(){const idx=Math.floor(Math.random()*N),out=idx%2?'BOGO':'FREE',st=performance.now(),dur=6600,sw=wa,sb=ba,fw=sw+(5.4+Math.random()*.5)*Math.PI*2,target=fw+(idx+.5)*STEP,fb=target-(9+Math.floor(Math.random()*2))*Math.PI*2;anim={idx,out,st,dur,sw,sb,fw,fb}}
btn.onclick=()=>{if(spinning)return;spinning=true;btn.disabled=true;result.className='result';stage.classList.remove('action');void stage.offsetWidth;stage.classList.add('action');setTimeout(begin,620)};
function frame(now){requestAnimationFrame(frame);if(anim){const t=Math.min(1,(now-anim.st)/anim.dur);wa=THREE.MathUtils.lerp(anim.sw,anim.fw,eo(t));wheel.rotation.y=wa;ba=THREE.MathUtils.lerp(anim.sb,anim.fb,ei(t));if(t<.68){br=3.12-.04*Math.sin(t*18);ball.position.y=.98+.025*Math.sin(t*42)}else{const d=(t-.68)/.32;br=THREE.MathUtils.lerp(3.09,2.47,eo(d));ball.position.y=THREE.MathUtils.lerp(.96,.87,eo(d))+Math.sin(d*Math.PI*5)*(1-d)*.055}ball.position.x=Math.cos(ba)*br;ball.position.z=-Math.sin(ba)*br;if(t>=1){const out=anim.out;anim=null;spinning=false;btn.disabled=false;stage.classList.remove('action');result.textContent=out==='FREE'?'🎉 FREE REQUEST — this one is on the house!':'🎉 BOGO REQUEST — choose a second song free!';result.className='result show '+(out==='FREE'?'free':'bogo');fireworks(out)}}else{wheel.rotation.y=wa;posBall()}renderer.render(scene,camera)}requestAnimationFrame(frame);
function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,true);renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';camera.aspect=w/h;const vf=THREE.MathUtils.degToRad(camera.fov),hf=2*Math.atan(Math.tan(vf/2)*camera.aspect),lf=Math.min(vf,hf),dist=(3.85*1.08)/Math.sin(lf/2);const tar=new THREE.Vector3(0,.7,0),dir=new THREE.Vector3(0,.64,.77).normalize();camera.position.copy(tar).addScaledVector(dir,dist);camera.lookAt(tar);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();
function burst(cx,cy,col,n=34,w=false){for(let i=0;i<n;i++){const p=document.createElement('i');p.className='p';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=col;p.style.boxShadow=`0 0 9px 2px ${col}`;document.body.appendChild(p);const a=Math.random()*Math.PI*2,d=(w?80:45)+Math.random()*(w?150:110),dx=Math.cos(a)*d,dy=Math.sin(a)*d+28;p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px)`,opacity:0}],{duration:800+Math.random()*500,easing:'cubic-bezier(.2,.65,.4,1)'}).onfinish=()=>p.remove()}}
function fireworks(out){const cols=out==='FREE'?['#55dcff','#fff','#718cff']:['#f45bdd','#fff','#9f7cff'];for(let b=0;b<8;b++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.1+Math.random()*.45),cols[Math.floor(Math.random()*cols.length)]),b*135);setTimeout(()=>{burst(innerWidth/2,innerHeight*.43,out==='FREE'?'#55dcff':'#f45bdd',60,true);const e=document.createElement('div');e.className='finale '+(out==='FREE'?'free':'bogo');e.textContent=out;document.body.appendChild(e);setTimeout(()=>e.remove(),2400)},1600)}
</script></body></html>
