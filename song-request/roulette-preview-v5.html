<body><div class="wrap"><section class="card"><div class="meta"><div><div class="song">Don't Stop Believin'</div><div class="artist">Journey</div></div><div class="price">$5</div></div><div class="label"><b>Step 1</b> — What's your name?</div><input class="name" placeholder="So I can give you a shout-out on the mic!"><div class="label"><b>Step 2</b> — Spin the roulette for a chance to win</div><div class="copy">The ball circles the outer rail, drops into the wheel and lands on <span class="f">F for FREE</span> or <span class="b">B for BOGO</span>.</div><div class="stage" id="stage"><img class="vegas-bg" src="https://images.pexels.com/photos/35120576/pexels-photo-35120576/free-photo-of-iconic-las-vegas-strip-at-night.jpeg?auto=compress&cs=tinysrgb&w=1200" alt=""><img class="dealer-scene" src="https://images.pexels.com/photos/7594575/pexels-photo-7594575.jpeg?auto=compress&cs=tinysrgb&w=1000" alt=""><div id="roulette3d"></div><div class="dealer-ball"></div></div><button class="spin" id="spin">Spin to Win</button><div class="result" id="result"></div></section></div>

outcome=idx%2?'BOGO':'FREE',now=performance.now(),dur=6500,sw=wa,sb=ba,fw=sw+(5.25+Math.random()*.65)*Math.PI*2,target=fw+(idx+.5)*STEP,loops=9+Math.floor(Math.random()*2),fb=target-loops*Math.PI*2;anim={now,dur,sw,sb,fw,fb,outcome}}btn.onclick=()=>{if(spinning)return;spinning=true;btn.disabled=true;result.className='result';result.textContent='';stage.classList.remove('release');void stage.offsetWidth;stage.classList.add('release');setTimeout(begin,620)};function loop(n){requestAnimationFrame(loop);if(anim){let t=Math.min(1,(n-anim.now)/anim.dur);wa=THREE.MathUtils.lerp(anim.sw,anim.fw,out(t));wheel.rotation.y=wa;ba=THREE.MathUtils.lerp(anim.sb,anim.fb,io(t));if(t<.68){br=3.07-.04*Math.sin(t*19);ball.position.y=.96+.025*Math.sin(t*40)}else{let d=(t-.68)/.32;br=THREE.MathUtils.lerp(3.05,2.4,out(d));ball.position.y=THREE.MathUtils.lerp(.94,.84,out(d))+Math.sin(d*Math.PI*5)*(1-d)*.055}ball.position.x=Math.cos(ba)*br;ball.position.z=-Math.sin(ba)*br;if(t>=1){const o=anim.outcome;anim=null;spinning=false;btn.disabled=false;stage.classList.remove('release');result.textContent=o==='FREE'?'🎉 FREE REQUEST — this one is on the house!':'🎉 BOGO REQUEST — choose a second song free!';result.className='result show '+(o==='FREE'?'free':'bogo');fireworks(o)}}else{wheel.rotation.y=wa;placeBall()}renderer.render(scene,camera)}requestAnimationFrame(loop);function resize(){const w=Math.max(1,host.clientWidth),h=Math.max(1,host.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;const vf=THREE.MathUtils.degToRad(camera.fov),hf=2*Math.atan(Math.tan(vf/2)*camera.aspect),lim=Math.min(vf,hf),dist=(3.78*1.04)/Math.sin(lim/2);camera.position.set(0,dist*.66,dist*.79);camera.lookAt(0,-.15,0);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();function burst(cx,cy,col,count=34){for(let i=0;i<count;i++){const p=document.createElement('i');p.className='p';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=col;p.style.boxShadow=`0 0 9px 2px ${col}`;doc
