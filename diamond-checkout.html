<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rick Parma - Enroll in Diamond Method</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="diamond-course.css">
<!-- SANDBOX Square Web Payments SDK. Swap to https://web.squarecdn.com/v1/square.js
     (and swap the Application ID / charge Function to production values) when ready to go live. -->
<script type="text/javascript" src="https://sandbox.web.squarecdn.com/v1/square.js"></script>
</head>
<body>

<header>
<h1><a href="/">RICK PARMA</a></h1>
<div class="socials">
<a href="https://instagram.com/rickparmaofficial" title="Instagram">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
</a>
<a href="https://www.facebook.com/rickparmaofficial" title="Facebook">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8h-2a2 2 0 0 0-2 2v10M9 13h5"/><circle cx="12" cy="12" r="9"/></svg>
</a>
<a href="rick-parma-full-contact-card.vcf" title="Save Contact">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="11" r="1.8"/><path d="M5 16c.5-1.8 2-2.5 3.5-2.5s3 .7 3.5 2.5M14 10h5M14 14h3.5"/></svg>
</a>
</div>
</header>

<div class="dm-wrap" style="max-width:480px;">
  <div class="dm-panel">
    <h2 style="margin-top:0;text-align:center;">Enroll &mdash; $20</h2>
    <p class="dm-muted dm-center">Create your account and pay in one step.</p>

    <form id="checkout-form">
      <div class="dm-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="dm-field">
        <label>Create a Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="dm-field">
        <label>Confirm Password</label>
        <input type="password" id="confirm-password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="dm-field">
        <label>Card</label>
        <div id="card-container"></div>
      </div>

      <div class="dm-btn-row" style="margin-top:20px;">
        <button type="submit" class="dm-btn" id="pay-button" style="width:100%;">Pay $20 and Enroll</button>
      </div>
      <div class="dm-error" id="payment-status"></div>
    </form>

    <p class="dm-center dm-muted" style="margin-top:20px;font-size:.85rem;">
      Already enrolled? <a href="diamond-login.html" style="color:var(--blue);">Log in</a>
    </p>
  </div>
</div>

<script src="diamond-course.js"></script>
<script>
var SQUARE_APPLICATION_ID = 'sandbox-sq0idb-yr8x302Uya8tsodDpURn_w';
var SQUARE_LOCATION_ID = 'L37PVG6MYV6TA';
var CHARGE_URL = 'https://rickparma-booking-8582.twil.io/course-charge';

var cardInstance = null;

async function initializeCard(payments) {
  var card = await payments.card();
  await card.attach('#card-container');
  return card;
}

document.addEventListener('DOMContentLoaded', async function () {
  var statusEl = document.getElementById('payment-status');
  var payButton = document.getElementById('pay-button');

  if (!window.Square) {
    statusEl.textContent = 'Payment form failed to load. Please refresh the page.';
    payButton.disabled = true;
    return;
  }

  try {
    var payments = window.Square.payments(SQUARE_APPLICATION_ID, SQUARE_LOCATION_ID);
    cardInstance = await initializeCard(payments);
  } catch (err) {
    statusEl.textContent = 'Payment form failed to load: ' + err.message;
    payButton.disabled = true;
    return;
  }

  document.getElementById('checkout-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirm-password').value;

    statusEl.textContent = '';

    if (!email || !password) {
      statusEl.textContent = 'Please fill out your email and password.';
      return;
    }
    if (password.length < 6) {
      statusEl.textContent = 'Password must be at least 6 characters.';
      return;
    }
    if (password !== confirmPassword) {
      statusEl.textContent = 'Passwords do not match.';
      return;
    }

    payButton.disabled = true;
    payButton.textContent = 'Processing...';

    try {
      var result = await cardInstance.tokenize();
      if (result.status !== 'OK') {
        var detail = (result.errors && result.errors[0] && result.errors[0].message) || 'Card was declined.';
        throw new Error(detail);
      }

      var params = new URLSearchParams();
      params.append('email', email);
      params.append('password', password);
      params.append('nonce', result.token);

      var res = await fetch(CHARGE_URL, { method: 'POST', body: params });
      var data = await res.json();

      if (data.ok) {
        dmSaveSession(email, password);
        location.href = 'diamond-course.html';
      } else {
        statusEl.textContent = data.error || 'Payment failed. Please try again.';
        payButton.disabled = false;
        payButton.textContent = 'Pay $20 and Enroll';
      }
    } catch (err) {
      statusEl.textContent = err.message || 'Something went wrong. Please try again.';
      payButton.disabled = false;
      payButton.textContent = 'Pay $20 and Enroll';
    }
  });
});
</script>

</body>
</html>
