name: Finish Pay Hub Manager
on:
  push:
    paths:
      - '.github/workflows/build-pay-hub-manager.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add paginated admin transactions endpoint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('functions/api/[[path]].js')
          s=p.read_text()
          old='''async function listTransactions(request, env) {
            if (!requireBearer(request, env.ADMIN_API_KEY)) {
              return json({ error: "Unauthorized." }, 401);
            }

            const rows = await env.PAYMENT_DB.prepare(`
              SELECT * FROM payment_intents ORDER BY created_at DESC LIMIT 200
            `).all();

            return json({ transactions: (rows.results || []).map(serializeIntent) });
          }'''
          new='''async function listTransactions(request, env) {
            if (!requireBearer(request, env.ADMIN_API_KEY)) {
              return json({ error: "Unauthorized." }, 401);
            }

            const url = new URL(request.url);
            const requestedLimit = Number(url.searchParams.get("limit") || 200);
            const requestedOffset = Number(url.searchParams.get("offset") || 0);
            const limit = Number.isFinite(requestedLimit) ? Math.min(Math.max(Math.trunc(requestedLimit), 1), 500) : 200;
            const offset = Number.isFinite(requestedOffset) ? Math.max(Math.trunc(requestedOffset), 0) : 0;

            const [rows, countRow] = await Promise.all([
              env.PAYMENT_DB.prepare(`
                SELECT * FROM payment_intents ORDER BY created_at DESC LIMIT ? OFFSET ?
              `).bind(limit, offset).all(),
              env.PAYMENT_DB.prepare(`SELECT COUNT(*) AS total FROM payment_intents`).first()
            ]);

            return json({
              transactions: (rows.results || []).map(serializeIntent),
              total: Number(countRow?.total || 0),
              limit,
              offset
            });
          }'''
          if old not in s:
              raise SystemExit('Expected listTransactions block not found; refusing unsafe patch')
          p.write_text(s.replace(old,new))
          PY
      - name: Generate Home Screen PNG icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p pay-manager/icons
          rsvg-convert -w 180 -h 180 pay-manager/icons/icon.svg > pay-manager/icons/icon-180.png
          rsvg-convert -w 192 -h 192 pay-manager/icons/icon.svg > pay-manager/icons/icon-192.png
          rsvg-convert -w 512 -h 512 pay-manager/icons/icon.svg > pay-manager/icons/icon-512.png
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/build-pay-hub-manager.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/'[[path]].js' pay-manager/icons .github/workflows/build-pay-hub-manager.yml
          git commit -m "Complete Pay Hub Manager app"
          git push
