name: Install EPK promo images

on:
  push:
    branches: [main]
    paths:
      - 'epk-assets-trigger.txt'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download full-quality EPK images
        run: |
          curl -L --fail --retry 3 -o epk-promo-mic.jpg "https://at.adobe.com/pLK2oLfCth68QwcG"
          curl -L --fail --retry 3 -o epk-promo-lounge.jpg "https://at.adobe.com/wLFHacQmkfFoWzfh"
          file epk-promo-mic.jpg epk-promo-lounge.jpg
          ls -lh epk-promo-mic.jpg epk-promo-lounge.jpg
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epk-promo-mic.jpg epk-promo-lounge.jpg
          git diff --cached --quiet || git commit -m "Replace EPK promo images with high-quality versions"
          git push
