name: Convert HD header to JPEG

on:
  push:
    branches:
      - agent/silver-vegas-redesign
    paths:
      - '.github/workflows/convert-header.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/silver-vegas-redesign

      - name: Install AVIF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libavif-bin

      - name: Convert existing HD AVIF to JPEG-compatible PNG
        run: |
          avifdec images/rick-parma-header-approved-hd.avif images/rick-parma-header-fresh-hd.png
          file images/rick-parma-header-fresh-hd.png

      - name: Commit HD image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/rick-parma-header-fresh-hd.png
          git commit -m 'Add Safari-safe HD header PNG' || exit 0
          git push origin HEAD:agent/silver-vegas-redesign
