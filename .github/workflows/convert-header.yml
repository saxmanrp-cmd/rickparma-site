name: Mute Promo Videos

on:
  push:
    branches:
      - agent/silver-vegas-redesign
    paths:
      - '.github/workflows/convert-header.yml'

permissions:
  contents: write

jobs:
  mute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/silver-vegas-redesign

      - name: Force promo videos muted
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old = 'return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1" + (autoplay ? "&autoplay=1" : "");'
          new = 'return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1&mute=1" + (autoplay ? "&autoplay=1" : "");'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('promo video embedURL pattern not found')
          PY

      - name: Commit muted promo videos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mute both promo videos" || exit 0
          git push origin HEAD:agent/silver-vegas-redesign
