name: Install Header Picture V62

"on":
  push:
    branches:
      - "agent/silver-vegas-redesign"
    paths:
      - "tmp/header-picture-v62-ready.txt"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/silver-vegas-redesign"

      - name: Patch homepage header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text()
          start = text.find("<header>")
          end = text.find("</header>", start)
          if start < 0 or end < 0:
              raise SystemExit("homepage header not found")
          end += len("</header>")

          old = text[start:end]
          m = re.search(r'  <div class="socials">.*?  </div>\s*</header>', old, re.S)
          if not m:
              raise SystemExit("social block not found")
          socials = m.group(0)
          socials = socials[:socials.rfind("</header>")].rstrip()

          new = '''<header class="site-header-hero">
  <picture class="site-header-picture">
    <source type="image/avif" srcset="images/rick-parma-header-approved-hd.avif?v=62">
    <img class="site-header-image" src="images/rick-parma-header-approved.jpg?v=62" alt="Rick Parma — Singer, Saxophonist, Entertainer" fetchpriority="high" decoding="async">
  </picture>
''' + socials + '''
</header>'''
          path.write_text(text[:start] + new + text[end:])

          css = '''/* RickParma.com — Phase 62: real image header only */
html body header.site-header-hero{
  position:relative!important;
  display:block!important;
  width:100%!important;
  height:auto!important;
  min-height:0!important;
  max-height:none!important;
  aspect-ratio:auto!important;
  margin:0!important;
  padding:0!important;
  overflow:hidden!important;
  border:0!important;
  box-shadow:none!important;
  background:#010307!important;
  background-image:none!important;
  transform:none!important;
  filter:none!important;
  contain:none!important;
}
html body header.site-header-hero::before,
html body header.site-header-hero::after{
  content:none!important;
  display:none!important;
}
html body header.site-header-hero .site-header-picture{
  display:block!important;
  width:100%!important;
  height:auto!important;
  margin:0!important;
  padding:0!important;
  line-height:0!important;
}
html body header.site-header-hero .site-header-image{
  display:block!important;
  width:100%!important;
  max-width:none!important;
  height:auto!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  object-fit:contain!important;
  object-position:center!important;
  transform:none!important;
  filter:none!important;
  image-rendering:auto!important;
}
@media(max-width:560px){
  html body header.site-header-hero,
  html body header.site-header-hero .site-header-picture,
  html body header.site-header-hero .site-header-image{
    width:100%!important;
    height:auto!important;
    max-width:none!important;
  }
}
'''
          Path("silver-vegas-phase62.css").write_text(css)

          polish = Path("design-polish.css")
          p = polish.read_text()
          line = "@import url('silver-vegas-phase62.css');"
          if line not in p:
              anchor = "@import url('silver-vegas-phase55.css');"
              if anchor not in p:
                  raise SystemExit("phase55 import not found")
              polish.write_text(p.replace(anchor, anchor + "\n" + line, 1))
          PY

      - name: Commit header patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html design-polish.css silver-vegas-phase62.css
          git commit -m "Phase 62 render header as real image" || exit 0
          git push origin HEAD:agent/silver-vegas-redesign
