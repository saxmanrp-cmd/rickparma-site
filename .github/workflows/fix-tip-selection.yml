name: Fix tip selection

on:
  push:
    branches:
      - agent/silver-vegas-redesign
    paths:
      - .github/workflows/fix-tip-selection.yml

permissions:
  contents: write

jobs:
  fix-tip-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/silver-vegas-redesign
          fetch-depth: 0

      - name: Repair homepage tip selector
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_buttons = '''      <div class="tip-amounts" id="tipAmounts">
                <button type="button" class="tip-amt reveal-item" style="--rd:0s" data-amt="5">$5</button>
                <button type="button" class="tip-amt reveal-item" style="--rd:.06s" data-amt="10">$10</button>
                <button type="button" class="tip-amt active reveal-item" style="--rd:.12s" data-amt="20">$20</button>
                <button type="button" class="tip-amt reveal-item" style="--rd:.18s" data-amt="50">$50</button>
              </div>
              <div class="tip-row" id="tipRow"><a id="tip-cta" class="tip-cta-btn" href="/pay/?mode=tip&amp;amount=20">Tip Rick</a>'''

          new_buttons = '''      <div class="tip-amounts" id="tipAmounts">
                <button type="button" class="tip-amt reveal-item" style="--rd:0s" data-amt="5" aria-pressed="false">$5</button>
                <button type="button" class="tip-amt reveal-item" style="--rd:.06s" data-amt="10" aria-pressed="false">$10</button>
                <button type="button" class="tip-amt reveal-item" style="--rd:.12s" data-amt="20" aria-pressed="false">$20</button>
                <button type="button" class="tip-amt reveal-item" style="--rd:.18s" data-amt="50" aria-pressed="false">$50</button>
              </div>
              <div class="tip-row" id="tipRow"><a id="tip-cta" class="tip-cta-btn" href="/pay/?mode=tip" aria-disabled="true">Tip Rick</a>'''

          old_script = """  (function() { var amtButtons = document.querySelectorAll('#tipAmounts .tip-amt'); var tipLink = document.getElementById('tip-cta'); function setTipAmount(amt) { amtButtons.forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-amt') === String(amt)); }); if (tipLink) tipLink.href = '/pay/?mode=tip&amount=' + amt; } amtButtons.forEach(function(btn) { btn.addEventListener('click', function() { setTipAmount(btn.getAttribute('data-amt')); }); }); })();"""

          new_script = """  (function() {
            var amtButtons = Array.prototype.slice.call(document.querySelectorAll('#tipAmounts .tip-amt'));
            var tipLink = document.getElementById('tip-cta');
            var tipPanel = tipLink ? tipLink.closest('.rp-card-panel') : null;
            var selectedAmount = null;

            function clearTipAmount() {
              selectedAmount = null;
              amtButtons.forEach(function(b) {
                b.classList.remove('active');
                b.setAttribute('aria-pressed', 'false');
              });
              if (tipPanel) tipPanel.classList.remove('tip-selection-made');
              if (tipLink) {
                tipLink.href = '/pay/?mode=tip';
                tipLink.setAttribute('aria-disabled', 'true');
              }
            }

            function setTipAmount(amt) {
              selectedAmount = String(amt);
              amtButtons.forEach(function(b) {
                var isSelected = b.getAttribute('data-amt') === selectedAmount;
                b.classList.toggle('active', isSelected);
                b.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
              });
              if (tipPanel) tipPanel.classList.add('tip-selection-made');
              if (tipLink) {
                tipLink.href = '/pay/?mode=tip&amount=' + encodeURIComponent(selectedAmount);
                tipLink.setAttribute('aria-disabled', 'false');
              }
            }

            clearTipAmount();
            amtButtons.forEach(function(btn) {
              btn.addEventListener('click', function() { setTipAmount(btn.getAttribute('data-amt')); });
            });
            if (tipLink) {
              tipLink.addEventListener('click', function(e) {
                if (!selectedAmount) e.preventDefault();
              });
            }
          })();"""

          if old_buttons not in s:
              raise SystemExit('Expected tip button markup not found; refusing broad edit.')
          if old_script not in s:
              raise SystemExit('Expected tip selector script not found; refusing broad edit.')

          s = s.replace(old_buttons, new_buttons, 1)
          s = s.replace(old_script, new_script, 1)
          p.write_text(s)

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix homepage tip amount selection"
          git push origin HEAD:agent/silver-vegas-redesign
