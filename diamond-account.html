<div class="dm-wrap" style="max-width:420px;">
  <div class="dm-top-links">
    <a href="diamond-course.html">Course Home</a>
    <a href="#" id="logout-link">Log out</a>
  </div>

  <div class="dm-panel" id="loading">
    <p class="dm-muted dm-center">Loading...</p>
  </div>

  <div class="dm-panel" id="account-content" style="display:none;">
    <h2 style="margin-top:0;text-align:center;">Change Password</h2>
    <p class="dm-muted dm-center" id="account-email"></p>

    <form id="password-form">
      <div class="dm-field">
        <label>Current Password</label>
        <input type="password" id="current-password" required autocomplete="current-password">
      </div>
      <div class="dm-field">
        <label>New Password</label>
        <input type="password" id="new-password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="dm-field">
        <label>Confirm New Password</label>
        <input type="password" id="confirm-new-password" required autocomplete="new-password" minlength="6">
      </div>
      <div class="dm-btn-row" style="margin-top:20px;">
        <button type="submit" class="dm-btn" id="save-button" style="width:100%;">Update Password</button>
      </div>
      <div class="dm-error" id="account-error"></div>
      <div class="dm-status" id="account-success"></div>
    </form>
  </div>
</div>

<script src="diamond-course.js"></script>
<script>
var currentAuth = null;

(async function () {
  currentAuth = await dmAuthenticate();
  if (!currentAuth) return;

  document.getElementById('account-email').textContent = currentAuth.student.email;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('account-content').style.display = 'block';

  document.getElementById('logout-link').addEventListener('click', function (e) {
    e.preventDefault();
    dmClearSession();
    location.href = 'diamond-login.html';
  });
})();

document.getElementById('password-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var errorEl = document.getElementById('account-error');
  var successEl = document.getElementById('account-success');
  var saveButton = document.getElementById('save-button');
  errorEl.textContent = '';
  successEl.textContent = '';

  var currentPassword = document.getElementById('current-password').value;
  var newPassword = document.getElementById('new-password').value;
  var confirmNewPassword = document.getElementById('confirm-new-password').value;

  if (newPassword.length < 6) {
    errorEl.textContent = 'New password must be at least 6 characters.';
    return;
  }
  if (newPassword !== confirmNewPassword) {
    errorEl.textContent = 'New passwords do not match.';
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = 'Saving...';

  try {
    var student = currentAuth.student;
    var currentHash = await dmSha256Hex(student.salt + currentPassword);
    if (currentHash !== student.passwordHash) {
      throw new Error('Current password is incorrect.');
    }

    var newSalt = crypto.randomUUID().replace(/-/g, '');
    var newHash = await dmSha256Hex(newSalt + newPassword);
    student.salt = newSalt;
    student.passwordHash = newHash;

    await dmSaveStudents(currentAuth.students);
    dmSaveSession(student.email, newPassword);

    successEl.textContent = 'Password updated.';
    document.getElementById('password-form').reset();
  } catch (err) {
    errorEl.textContent = err.message || 'Could not update password.';
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = 'Update Password';
  }
});
</script>
