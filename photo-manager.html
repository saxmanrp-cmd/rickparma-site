<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Photo Manager">
<link rel="apple-touch-icon" sizes="180x180" href="images/PHOTO MANAGER-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="images/PHOTO MANAGER-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="images/PHOTO MANAGER-icon-152.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/PHOTO MANAGER-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="images/PHOTO MANAGER-icon-512.png">
<meta name="theme-color" content="#0d0505">
<title>Rick Parma – Photo Manager</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    padding: max(env(safe-area-inset-top), 52px) 16px max(env(safe-area-inset-bottom), 100px);
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin   { to { transform:rotate(360deg); } }
  .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { font-size:17px; font-weight:900; letter-spacing:0.08em; text-transform:uppercase; color:#8DB2E5; }
  .sync-badge { font-size:10px; color:rgba(255,255,255,0.4); display:flex; align-items:center; gap:5px; cursor:pointer; }
  .sync-dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.3); flex-shrink:0; }
  .sync-dot.synced  { background:#4caf7d; }
  .sync-dot.syncing { background:#8DB2E5; animation:pulse 1s ease-in-out infinite; }
  .sync-dot.error   { background:#e05555; }
  /* ── GitHub connect panel ── */
  .connect-panel { background:#1a0808; border-radius:10px; padding:16px; margin-bottom:16px; border:1.5px solid rgba(141,178,229,0.4); }
  .connect-panel h2 { font-size:14px; color:#8DB2E5; margin-bottom:8px; letter-spacing:0.04em; }
  .connect-panel p { font-size:12px; color:rgba(255,255,255,0.55); margin-bottom:12px; line-height:1.5; }
  .connect-panel input { width:100%; background:#0d0505; border:1.5px solid rgba(141,178,229,0.3); border-radius:8px; color:#fff; font-size:15px; padding:11px 12px; outline:none; margin-bottom:10px; }
  .connect-panel input:focus { border-color:#8DB2E5; }
  .btn-connect { width:100%; background:linear-gradient(135deg,#8DB2E5,#6a94cc); color:#0d0505; border:none; border-radius:8px; font-size:13px; font-weight:900; letter-spacing:0.06em; text-transform:uppercase; padding:12px; cursor:pointer; }
  .connect-status { font-size:11px; color:#e57a7a; margin-top:8px; min-height:14px; }
  .token-linked-row { display:flex; align-items:center; justify-content:space-between; background:#1a0808; border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:12px; color:rgba(255,255,255,0.5); }
  .token-linked-row button { background:none; border:1px solid rgba(255,255,255,0.2); color:rgba(255,255,255,0.6); border-radius:6px; font-size:11px; padding:5px 10px; cursor:pointer; }
  /* ── Add panel ── */
  .add-panel { background:#1a0808; border-radius:10px; padding:14px; margin-bottom:16px; }
  /* URL row */
  .url-row { display:flex; gap:8px; margin-bottom:0; }
  .url-row input { flex:1; background:#0d0505; border:1.5px solid rgba(141,178,229,0.3); border-radius:8px; color:#fff; font-size:16px; padding:11px 12px; outline:none; min-width:0; }
  .url-row input:focus { border-color:#8DB2E5; }
  .url-row input::placeholder { color:rgba(255,255,255,0.25); }
  .btn-preview { background:#8DB2E5; color:#0d0505; border:none; border-radius:8px; font-size:13px; font-weight:900; padding:0 14px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .btn-preview:active { background:#7aa0d4; }
  /* Divider between URL paste and file upload */
  .add-divider { display:flex; align-items:center; gap:10px; margin:14px 0; color:rgba(255,255,255,0.3); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; }
  .add-divider::before, .add-divider::after { content:""; flex:1; height:1px; background:rgba(255,255,255,0.1); }
  /* File upload row */
  .file-row { display:flex; gap:8px; }
  .file-picker-btn { flex:1; background:#0d0505; border:1.5px dashed rgba(141,178,229,0.4); border-radius:8px; color:rgba(255,255,255,0.6); font-size:13px; padding:11px 12px; text-align:center; cursor:pointer; }
  .file-picker-btn.has-file { border-style:solid; border-color:#8DB2E5; color:#fff; }
  input[type="file"] { display:none; }
  .btn-upload { background:#8DB2E5; color:#0d0505; border:none; border-radius:8px; font-size:13px; font-weight:900; padding:0 14px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .btn-upload:disabled { opacity:0.4; cursor:default; }
  .upload-status { font-size:11px; color:#8DB2E5; margin-top:8px; min-height:14px; }
  .upload-status.error { color:#e57a7a; }
  /* Preview area — hidden until URL loaded */
  .preview-area { display:none; margin-top:12px; }
  .preview-area.visible { display:block; }
  .preview-img-wrap {
    width:100%; border-radius:8px; overflow:hidden;
    background:#0d0505; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center;
    min-height:120px;
  }
  .preview-img-wrap img { width:100%; max-height:280px; object-fit:contain; display:block; border-radius:8px; }
  .preview-img-wrap .preview-error { color:rgba(255,255,255,0.3); font-size:13px; padding:24px; text-align:center; }
  .name-save-row { display:flex; gap:8px; }
  .name-save-row input { flex:1; background:#0d0505; border:1.5px solid rgba(141,178,229,0.3); border-radius:8px; color:#fff; font-size:16px; padding:10px 12px; outline:none; min-width:0; }
  .name-save-row input:focus { border-color:#8DB2E5; }
  .name-save-row input::placeholder { color:rgba(255,255,255,0.25); }
  .btn-save { background:#4caf7d; color:#0d0505; border:none; border-radius:8px; font-size:13px; font-weight:900; padding:0 16px; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .btn-save:active { background:#3d9e6c; }
  .btn-save:disabled { opacity:0.4; cursor:default; }
  /* ── Photo list ── */
  .photo-item { display:flex; align-items:center; gap:10px; background:#1a0808; border-radius:8px; padding:10px 12px; margin-bottom:8px; cursor:grab; user-select:none; border:1.5px solid transparent; }
  .photo-item.drag-over { border-color:#8DB2E5; background:#2a1010; }
  .photo-item.dragging  { opacity:0.4; }
  .drag-handle { color:rgba(255,255,255,0.35); font-size:20px; flex-shrink:0; padding:8px 6px; margin:-8px 0; cursor:grab; touch-action:none; }
  .photo-thumb { width:40px; height:53px; object-fit:cover; border-radius:4px; background:#2a1010; flex-shrink:0; cursor:pointer; }
  .photo-thumb:active { opacity:0.7; }
  .photo-thumb-err { width:40px; height:53px; border-radius:4px; background:#2a1010; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:16px; opacity:0.4; cursor:pointer; }
  .photo-info { flex:1; min-width:0; }
  .photo-name { font-size:12px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:1px; }
  .photo-num  { font-size:10px; color:#8DB2E5; letter-spacing:0.1em; font-weight:700; margin-bottom:1px; }
  .photo-url  { font-size:10px; color:rgba(255,255,255,0.3); font-family:monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn-delete { background:none; border:none; color:rgba(255,255,255,0.25); font-size:20px; cursor:pointer; padding:4px 6px; border-radius:4px; flex-shrink:0; line-height:1; }
  .btn-delete:active { color:#e57a7a; }
  .empty-state { text-align:center; color:rgba(255,255,255,0.2); font-size:13px; padding:32px 0; }
  .photo-thumb-video { width:40px; height:53px; border-radius:4px; background:#2a1010; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; }
  .preview-img-wrap video { width:100%; max-height:280px; display:block; border-radius:8px; }
  .img-overlay video { max-width:92vw; max-height:88vh; border-radius:8px; box-shadow:0 16px 80px rgba(0,0,0,0.9); }
  .btn-generate { width:100%; background:linear-gradient(135deg,#8DB2E5,#6a94cc); color:#0d0505; border:none; border-radius:8px; font-size:14px; font-weight:900; letter-spacing:0.08em; text-transform:uppercase; padding:14px; cursor:pointer; margin-top:8px; }
  .btn-generate:active { opacity:0.8; }
  .btn-generate:disabled { opacity:0.4; cursor:default; }
  .copy-confirm { text-align:center; font-size:12px; color:#4caf7d; margin-top:10px; height:18px; }
  /* ── Full image overlay (tap thumbnail) ── */
  .img-overlay { display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.93); align-items:center; justify-content:center; padding:24px; }
  .img-overlay.open { display:flex; }
  .img-overlay img { max-width:92vw; max-height:88vh; object-fit:contain; border-radius:8px; box-shadow:0 16px 80px rgba(0,0,0,0.9); }
  .img-overlay-close { position:fixed; top:16px; right:16px; width:32px; height:32px; background:#8DB2E5; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:#0d0505; font-weight:900; }
  /* ── Loading ── */
  .loading-screen { position:fixed; inset:0; background:#0d0505; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:200; }
  .spinner { width:24px; height:24px; border:3px solid rgba(141,178,229,0.2); border-top-color:#8DB2E5; border-radius:50%; animation:spin 0.7s linear infinite; }
  .loading-screen p { font-size:11px; color:rgba(255,255,255,0.4); letter-spacing:0.12em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Loading from cloud…</p>
</div>
<!-- Full image/video overlay -->
<div class="img-overlay" id="imgOverlay" onclick="closeOverlay()">
  <div class="img-overlay-close" onclick="closeOverlay()">✕</div>
  <div id="overlayContent"></div>
</div>
<div id="appWrap" style="display:none">
  <div class="header-top">
    <h1>📷 Photo Manager</h1>
    <div class="sync-badge" onclick="showConnectPanel()" title="Tap to change GitHub token">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">Loading…</span>
    </div>
  </div>
  <div id="lastUpdated" style="font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.06em;margin-bottom:12px;"></div>

  <!-- GitHub connect panel — shown when no token is saved yet -->
  <div class="connect-panel" id="connectPanel" style="display:none">
    <h2>Connect to GitHub</h2>
    <p>Paste your fine-grained token (Contents: Read and write, scoped to rickparma-site only). It's saved only on this device, never in this file.</p>
    <input type="password" id="input-token" placeholder="github_pat_…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <button class="btn-connect" onclick="saveToken()">Save Token</button>
    <p class="connect-status" id="connectStatus"></p>
  </div>
  <!-- Shown once a token is saved -->
  <div class="token-linked-row" id="tokenLinkedRow" style="display:none">
    <span>✓ GitHub connected</span>
    <button onclick="showConnectPanel()">Change token</button>
  </div>

  <!-- Add panel -->
  <div class="add-panel">
    <div class="url-row">
      <input type="url" id="input-url" placeholder="Paste image URL…" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
      <button class="btn-preview" onclick="loadPreview()">Preview</button>
    </div>

    <div class="add-divider">or upload a flyer</div>

    <div class="file-row">
      <div class="file-picker-btn" id="filePickerBtn" onclick="document.getElementById('input-file').click()">Choose photo or video…</div>
      <input type="file" id="input-file" accept="image/*,video/*" onchange="onFileChosen(event)">
      <button class="btn-upload" id="btnUpload" onclick="uploadChosenFile()" disabled>Upload</button>
    </div>
    <div class="upload-status" id="uploadStatus"></div>

    <div class="preview-area" id="previewArea">
      <div class="preview-img-wrap" id="previewImgWrap">
        <img id="previewImg" src="" alt="" onerror="showPreviewError()">
      </div>
      <div class="name-save-row">
        <input type="text" id="input-name" placeholder="Flyer name (optional)…" autocorrect="off" autocapitalize="words" spellcheck="false">
        <button class="btn-save" id="btnSave" onclick="savePhoto()">Save</button>
      </div>
    </div>
  </div>
  <div id="photo-list"></div>
  <button class="btn-generate" onclick="pushToWebsite()">⬆ Push to Website</button>
  <p class="copy-confirm" id="copy-confirm"></p>
</div>
<script>
  var BIN_API_KEY = "$2a$10$AE8jTzF3OJJNfqTgYPcPK.SzVAdv0Mqi/obwqWTuQjpE0dOkYkCE.";
  var BIN_BASE    = "https://api.jsonbin.io/v3";
  var BIN_ID      = "6a29c91cda38895dfea92f08";

  // ── GitHub upload config ────────────────────────────────────
  // The token itself is never stored in this file - it lives only in this browser's
  // localStorage, entered once through the "Connect to GitHub" panel below.
  var GH_OWNER  = "saxmanrp-cmd";
  var GH_REPO   = "rickparma-site";
  var GH_BRANCH = "main";
  var GH_MEDIA_PATH = "media"; // files land in /media/ inside the repo
  var GH_TOKEN_KEY = "rp_photo_manager_gh_token";
  var GH_TOKEN = localStorage.getItem(GH_TOKEN_KEY) || "";

  var photos = [];
  var dragSrcIndex = null;
  var isSaving = false;
  var pendingSrc = "";
  var chosenFile = null;

  function setSyncStatus(state, label) {
    document.getElementById("syncDot").className = "sync-dot " + state;
    document.getElementById("syncLabel").textContent = label;
  }

  // ── Token connect flow ──────────────────────────────────────
  function showConnectPanel() {
    document.getElementById("connectPanel").style.display = "block";
    document.getElementById("tokenLinkedRow").style.display = "none";
    document.getElementById("input-token").focus();
  }
  function hideConnectPanel() {
    document.getElementById("connectPanel").style.display = "none";
    document.getElementById("tokenLinkedRow").style.display = GH_TOKEN ? "flex" : "none";
  }
  function saveToken() {
    var val = document.getElementById("input-token").value.trim();
    if (!val) { document.getElementById("connectStatus").textContent = "Paste a token first."; return; }
    localStorage.setItem(GH_TOKEN_KEY, val);
    GH_TOKEN = val;
    document.getElementById("input-token").value = "";
    document.getElementById("connectStatus").textContent = "";
    hideConnectPanel();
  }
  function refreshConnectUI() {
    if (GH_TOKEN) {
      document.getElementById("connectPanel").style.display = "none";
      document.getElementById("tokenLinkedRow").style.display = "flex";
    } else {
      document.getElementById("connectPanel").style.display = "block";
      document.getElementById("tokenLinkedRow").style.display = "none";
    }
  }

  async function load() {
    try {
      var res = await fetch(BIN_BASE + "/b/" + BIN_ID + "/latest", { headers: { "X-Master-Key": BIN_API_KEY } });
      if (res.ok) {
        var data = await res.json();
        photos = data.record.photos || [];
        showLastUpdated(data.record.lastUpdated || null);
        setSyncStatus("synced", "Synced ✓");
      } else {
        throw new Error("Load failed");
      }
    } catch(e) {
      photos = [];
      setSyncStatus("error", "Load failed");
    }
  }
  // Auto-refresh every 30 seconds to always pull latest
  setInterval(async function() {
    try {
      var res = await fetch(BIN_BASE + "/b/" + BIN_ID + "/latest", { headers: { "X-Master-Key": BIN_API_KEY } });
      if (res.ok) {
        var data = await res.json();
        var fresh = data.record.photos || [];
        if (JSON.stringify(fresh) !== JSON.stringify(photos)) {
          photos = fresh;
          render();
          showLastUpdated(data.record.lastUpdated || null);
          setSyncStatus("synced", "Synced ✓");
        }
      }
    } catch(e) {}
  }, 30000);
  async function save() {
    if (isSaving) return;
    isSaving = true;
    setSyncStatus("syncing", "Saving…");
    try {
      var now = new Date().toISOString();
      var res = await fetch(BIN_BASE + "/b/" + BIN_ID, {
        method: "PUT",
        headers: { "Content-Type":"application/json", "X-Master-Key":BIN_API_KEY },
        body: JSON.stringify({ photos: photos, lastUpdated: now })
      });
      if (!res.ok) throw new Error("Save failed");
      setSyncStatus("synced", "Saved ✓");
      showLastUpdated(now);
    } catch(e) { setSyncStatus("error", "Save failed"); }
    isSaving = false;
  }
  function showLastUpdated(iso) {
    var el = document.getElementById("lastUpdated");
    if (!el || !iso) return;
    var d = new Date(iso);
    el.textContent = "Last updated: " + d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" }) + " at " + d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
  }
  // ── Media helpers ───────────────────────────────────────────
  function isVideo(src) {
    return /\.(mov|mp4|webm|ogg)(\?|$)/i.test(src);
  }

  // ── File → base64 helper ────────────────────────────────────
  function fileToBase64(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() {
        var result = reader.result;
        var comma = result.indexOf(",");
        resolve(result.slice(comma + 1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function sanitizeFilename(name) {
    return name.replace(/[^a-zA-Z0-9._-]/g, "-");
  }
  function ghHeaders() {
    return {
      "Authorization": "token " + GH_TOKEN,
      "Accept": "application/vnd.github+json"
    };
  }
  function setUploadStatus(text, isError) {
    var el = document.getElementById("uploadStatus");
    el.textContent = text;
    el.className = "upload-status" + (isError ? " error" : "");
  }

  // ── Compression ──────────────────────────────────────────────
  function compressImage(file, maxDim, quality) {
    return new Promise(function(resolve) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function() {
        URL.revokeObjectURL(url);
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          if (!blob) { resolve(file); return; }
          var newFile = new File([blob], file.name.replace(/\.[^.]+$/, ".jpg"), { type: "image/jpeg" });
          resolve(newFile.size < file.size ? newFile : file);
        }, "image/jpeg", quality);
      };
      img.onerror = function() { resolve(file); };
      img.src = url;
    });
  }
  function compressVideo(file, maxDim) {
    return new Promise(function(resolve) {
      if (typeof MediaRecorder === "undefined") { resolve(file); return; }
      var mimeType = "";
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("video/mp4")) mimeType = "video/mp4";
      else if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported("video/webm")) mimeType = "video/webm";
      if (!mimeType) { resolve(file); return; }

      var video = document.createElement("video");
      video.muted = true; video.playsInline = true;
      var url = URL.createObjectURL(file);
      video.src = url;
      var settled = false;
      function finish(result) {
        if (settled) return;
        settled = true;
        URL.revokeObjectURL(url);
        resolve(result);
      }
      var safetyTimer = setTimeout(function() { finish(file); }, 60000);

      video.onloadedmetadata = function() {
        try {
          var scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
          var w = Math.round(video.videoWidth * scale) || video.videoWidth;
          var h = Math.round(video.videoHeight * scale) || video.videoHeight;
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");

          var combined = new MediaStream(canvas.captureStream(30).getVideoTracks());
          if (video.captureStream) {
            try { video.captureStream().getAudioTracks().forEach(function(t){ combined.addTrack(t); }); } catch(e) {}
          }

          var chunks = [];
          var recorder = new MediaRecorder(combined, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
          recorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
          recorder.onstop = function() {
            clearTimeout(safetyTimer);
            if (chunks.length === 0) { finish(file); return; }
            var blob = new Blob(chunks, { type: mimeType });
            var ext = mimeType.indexOf("mp4") >= 0 ? "mp4" : "webm";
            var newFile = new File([blob], file.name.replace(/\.[^.]+$/, "." + ext), { type: mimeType });
            finish(newFile.size < file.size ? newFile : file);
          };
          recorder.onerror = function() { clearTimeout(safetyTimer); finish(file); };

          video.play().then(function() {
            recorder.start();
            (function drawFrame() {
              if (video.paused || video.ended) { recorder.stop(); return; }
              ctx.drawImage(video, 0, 0, w, h);
              requestAnimationFrame(drawFrame);
            })();
          }).catch(function() { clearTimeout(safetyTimer); finish(file); });

          video.onended = function() { try { recorder.stop(); } catch(e) {} };
        } catch(e) { clearTimeout(safetyTimer); finish(file); }
      };
      video.onerror = function() { clearTimeout(safetyTimer); finish(file); };
    });
  }

  // Uploads a file to the GitHub repo using the Git Data API (blob → tree → commit → ref).
  async function uploadFileToGitHub(file, onProgress) {
    if (!GH_TOKEN) throw new Error("Connect your GitHub token first (tap the sync status at the top).");
    var path = GH_MEDIA_PATH + "/" + Date.now() + "-" + sanitizeFilename(file.name);
    var base = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO;

    onProgress("Reading file…");
    var base64 = await fileToBase64(file);

    onProgress("Uploading blob…");
    var blobRes = await fetch(base + "/git/blobs", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify({ content: base64, encoding: "base64" })
    });
    if (blobRes.status === 401) throw new Error("Token rejected — reconnect via the sync status at top.");
    if (!blobRes.ok) throw new Error("Blob upload failed (" + blobRes.status + ")");
    var blob = await blobRes.json();

    onProgress("Reading branch…");
    var refRes = await fetch(base + "/git/refs/heads/" + GH_BRANCH, { headers: ghHeaders() });
    if (!refRes.ok) throw new Error("Could not read branch ref (" + refRes.status + ")");
    var ref = await refRes.json();
    var latestCommitSha = ref.object.sha;

    var commitRes = await fetch(base + "/git/commits/" + latestCommitSha, { headers: ghHeaders() });
    if (!commitRes.ok) throw new Error("Could not read latest commit (" + commitRes.status + ")");
    var latestCommit = await commitRes.json();
    var baseTreeSha = latestCommit.tree.sha;

    onProgress("Building tree…");
    var treeRes = await fetch(base + "/git/trees", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify({
        base_tree: baseTreeSha,
        tree: [{ path: path, mode: "100644", type: "blob", sha: blob.sha }]
      })
    });
    if (!treeRes.ok) throw new Error("Tree creation failed (" + treeRes.status + ")");
    var tree = await treeRes.json();

    onProgress("Committing…");
    var newCommitRes = await fetch(base + "/git/commits", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify({
        message: "Add flyer: " + file.name,
        tree: tree.sha,
        parents: [latestCommitSha]
      })
    });
    if (!newCommitRes.ok) throw new Error("Commit failed (" + newCommitRes.status + ")");
    var newCommit = await newCommitRes.json();

    onProgress("Publishing…");
    var updateRefRes = await fetch(base + "/git/refs/heads/" + GH_BRANCH, {
      method: "PATCH",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify({ sha: newCommit.sha })
    });
    if (!updateRefRes.ok) throw new Error("Branch update failed (" + updateRefRes.status + ")");

    return "https://" + GH_OWNER + ".github.io/" + GH_REPO + "/" + path;
  }

  // ── File picker flow ────────────────────────────────────────
  function onFileChosen(e) {
    var file = e.target.files[0];
    if (!file) return;
    chosenFile = file;
    var btn = document.getElementById("filePickerBtn");
    btn.textContent = file.name;
    btn.classList.add("has-file");
    document.getElementById("btnUpload").disabled = false;
    setUploadStatus("");
  }
  async function uploadChosenFile() {
    if (!chosenFile) return;
    if (!GH_TOKEN) { setUploadStatus("Connect your GitHub token first (tap the sync status at top).", true); showConnectPanel(); return; }
    var btn = document.getElementById("btnUpload");
    btn.disabled = true;
    try {
      var isVid = chosenFile.type.indexOf("video") === 0;
      var originalSize = chosenFile.size;
      var fileToUpload = chosenFile;

      if (isVid) {
        setUploadStatus("Compressing video…");
        fileToUpload = await compressVideo(chosenFile, 1280);
      } else {
        setUploadStatus("Compressing image…");
        fileToUpload = await compressImage(chosenFile, 1600, 0.82);
      }
      if (fileToUpload.size < originalSize) {
        setUploadStatus("Compressed " + Math.round(originalSize/1024) + "KB → " + Math.round(fileToUpload.size/1024) + "KB. Uploading…");
      } else {
        setUploadStatus("Uploading…");
      }

      var url = await uploadFileToGitHub(fileToUpload, function(msg) { setUploadStatus(msg); });
      setUploadStatus("Uploaded ✓ — now saving to gallery…");
      var name = chosenFile.name.replace(/\.[^.]+$/, "");
      photos.push({ src: url, name: name });
      chosenFile = null;
      document.getElementById("input-file").value = "";
      var pickerBtn = document.getElementById("filePickerBtn");
      pickerBtn.textContent = "Choose photo or video…";
      pickerBtn.classList.remove("has-file");
      render();
      await save();
      setUploadStatus("Saved ✓ — hit \"Push to Website\" below when you're ready to publish.");
    } catch(err) {
      setUploadStatus(err.message || "Upload failed", true);
    }
    btn.disabled = false;
  }

  // ── Preview flow (URL paste path) ────────────────────────────
  function loadPreview() {
    var src = document.getElementById("input-url").value.trim();
    if (!src) { alert("Paste an image or video URL first."); return; }
    pendingSrc = src;
    var wrap = document.getElementById("previewImgWrap");
    if (isVideo(src)) {
      wrap.innerHTML = '<video src="' + src + '" controls playsinline loop style="width:100%;max-height:280px;display:block;border-radius:8px;"></video>';
    } else {
      wrap.innerHTML = '<img src="' + src + '" alt="" onerror="showPreviewError()" style="width:100%;max-height:280px;object-fit:contain;display:block;border-radius:8px;">';
    }
    document.getElementById("previewArea").classList.add("visible");
    document.getElementById("input-name").focus();
  }
  function showPreviewError() {
    document.getElementById("previewImgWrap").innerHTML = '<div class="preview-error">⚠️ Could not load media.<br>Check the URL and try again.</div>';
  }
  async function savePhoto() {
    var src  = pendingSrc || document.getElementById("input-url").value.trim();
    var name = document.getElementById("input-name").value.trim();
    if (!src) { alert("No image to save."); return; }
    for (var j=0; j<photos.length; j++) { if (photos[j].src===src) { alert("Already in gallery."); return; } }
    photos.push({ src: src, name: name });
    document.getElementById("input-url").value = "";
    document.getElementById("input-name").value = "";
    document.getElementById("previewArea").classList.remove("visible");
    pendingSrc = "";
    render();
    await save();
  }
  // ── Full image/video overlay ────────────────────────────────
  function openOverlay(src) {
    var content = document.getElementById("overlayContent");
    if (isVideo(src)) {
      content.innerHTML = '<video src="' + src + '" controls autoplay playsinline loop style="max-width:92vw;max-height:88vh;border-radius:8px;"></video>';
    } else {
      content.innerHTML = '<img src="' + src + '" alt="" style="max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px;box-shadow:0 16px 80px rgba(0,0,0,0.9);">';
    }
    document.getElementById("imgOverlay").classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeOverlay() {
    var v = document.querySelector("#overlayContent video");
    if (v) v.pause();
    document.getElementById("overlayContent").innerHTML = "";
    document.getElementById("imgOverlay").classList.remove("open");
    document.body.style.overflow = "";
  }
  // ── Touch drag reorder ──────────────────────────────────────
  var touchDragIndex = null;
  var touchDragEl = null;
  var touchDragClone = null;
  var touchDragOffsetY = 0;
  function initTouchDrag(handle, index) {
    handle.addEventListener("touchstart", function(e) {
      e.preventDefault();
      touchDragIndex = index;
      var list = document.getElementById("photo-list");
      var items = list.querySelectorAll(".photo-item");
      touchDragEl = items[index];
      var rect = touchDragEl.getBoundingClientRect();
      touchDragOffsetY = e.touches[0].clientY - rect.top;
      touchDragClone = touchDragEl.cloneNode(true);
      touchDragClone.style.cssText = "position:fixed;left:" + rect.left + "px;top:" + rect.top + "px;width:" + rect.width + "px;opacity:0.85;z-index:500;pointer-events:none;border-color:#8DB2E5;background:#2a1010;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.6);";
      document.body.appendChild(touchDragClone);
      touchDragEl.style.opacity = "0.3";
    }, { passive: false });
    handle.addEventListener("touchmove", function(e) {
      if (touchDragIndex === null) return;
      e.preventDefault();
      var y = e.touches[0].clientY;
      touchDragClone.style.top = (y - touchDragOffsetY) + "px";
      var list = document.getElementById("photo-list");
      var items = list.querySelectorAll(".photo-item");
      items.forEach(function(el) { el.classList.remove("drag-over"); });
      for (var j = 0; j < items.length; j++) {
        var r = items[j].getBoundingClientRect();
        if (y >= r.top && y <= r.bottom && j !== touchDragIndex) {
          items[j].classList.add("drag-over");
          break;
        }
      }
    }, { passive: false });
    handle.addEventListener("touchend", async function(e) {
      if (touchDragIndex === null) return;
      var y = e.changedTouches[0].clientY;
      var list = document.getElementById("photo-list");
      var items = list.querySelectorAll(".photo-item");
      var targetIndex = touchDragIndex;
      for (var j = 0; j < items.length; j++) {
        var r = items[j].getBoundingClientRect();
        if (y >= r.top && y <= r.bottom) { targetIndex = j; break; }
      }
      if (touchDragClone) { document.body.removeChild(touchDragClone); touchDragClone = null; }
      if (touchDragEl) { touchDragEl.style.opacity = ""; touchDragEl = null; }
      items.forEach(function(el) { el.classList.remove("drag-over"); });
      if (targetIndex !== touchDragIndex) {
        var moved = photos.splice(touchDragIndex, 1)[0];
        photos.splice(targetIndex, 0, moved);
        render();
        await save();
      }
      touchDragIndex = null;
    });
  }
  // ── Render list ─────────────────────────────────────────────
  function truncUrl(u) { return u.length <= 46 ? u : u.slice(0,24) + "…" + u.slice(-16); }
  function render() {
    var list = document.getElementById("photo-list");
    list.innerHTML = "";
    if (photos.length === 0) { list.innerHTML = '<div class="empty-state">No photos yet.</div>'; return; }
    photos.forEach(function(p, i) {
      var item = document.createElement("div");
      item.className = "photo-item";
      var nameHtml = p.name ? '<div class="photo-name">' + p.name + '</div>' : '';
      var thumbHtml = isVideo(p.src)
        ? '<div class="photo-thumb-video" onclick="openOverlay(\'' + p.src.replace(/'/g,"\\'") + '\')">🎬</div>'
        : '<img class="photo-thumb" src="' + p.src + '" onerror="this.className=\'photo-thumb-err\';this.innerHTML=\'❌\'" alt="" onclick="openOverlay(\'' + p.src.replace(/'/g,"\\'") + '\')">';
      item.innerHTML =
        '<span class="drag-handle">⠿</span>' +
        thumbHtml +
        '<div class="photo-info"><div class="photo-num">PHOTO ' + (i+1) + '</div>' + nameHtml + '<div class="photo-url">' + truncUrl(p.src) + '</div></div>' +
        '<button class="btn-delete" onclick="removePhoto(' + i + ')">×</button>';
      var handle = item.querySelector(".drag-handle");
      initTouchDrag(handle, i);
      list.appendChild(item);
    });
  }
  async function removePhoto(index) {
    if (!confirm("Remove photo " + (index+1) + (photos[index].name ? ' "' + photos[index].name + '"' : "") + "?")) return;
    photos.splice(index, 1);
    render();
    await save();
  }
  // ── Push to Website ──────────────────────────────────────────
  async function pushFlyersJson() {
    if (!GH_TOKEN) throw new Error("Connect your GitHub token first (tap the sync status at top).");
    var base = "https://api.github.com/repos/" + GH_OWNER + "/" + GH_REPO;
    var path = "flyers.json";
    var payload = photos.map(function(p) { return { src: p.src, name: p.name || "" }; });
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));

    var sha = null;
    var getRes = await fetch(base + "/contents/" + path + "?ref=" + GH_BRANCH, { headers: ghHeaders() });
    if (getRes.ok) {
      var info = await getRes.json();
      sha = info.sha;
    } else if (getRes.status !== 404) {
      throw new Error("Could not read flyers.json (" + getRes.status + ")");
    }

    var body = { message: "Update flyers.json", content: content, branch: GH_BRANCH };
    if (sha) body.sha = sha;
    var putRes = await fetch(base + "/contents/" + path, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify(body)
    });
    if (!putRes.ok) throw new Error("Publish failed (" + putRes.status + ")");
  }
  async function pushToWebsite() {
    if (photos.length === 0) { alert("Add at least one photo first."); return; }
    if (!GH_TOKEN) { showConnectPanel(); return; }
    var btn = document.querySelector(".btn-generate");
    btn.disabled = true;
    try {
      showConfirm("Publishing…", false);
      await pushFlyersJson();
      showConfirm("✓ Live on the site (may take ~30-60s to show up).", false);
    } catch(err) {
      showConfirm(err.message || "Publish failed", true);
    }
    btn.disabled = false;
  }
  function showConfirm(text, isError) {
    var c = document.getElementById("copy-confirm");
    c.textContent = text;
    c.style.color = isError ? "#e57a7a" : "#4caf7d";
    if (!isError) setTimeout(function(){ if (c.textContent === text) c.textContent = ""; }, 4000);
  }
  // ── Keyboard shortcuts ──────────────────────────────────────
  document.getElementById("input-url").addEventListener("keydown", function(e){ if(e.key==="Enter") loadPreview(); });
  document.getElementById("input-name").addEventListener("keydown", function(e){ if(e.key==="Enter") savePhoto(); });
  document.getElementById("input-token").addEventListener("keydown", function(e){ if(e.key==="Enter") saveToken(); });
  // ── Init ────────────────────────────────────────────────────
  setSyncStatus("syncing", "Loading…");
  load().then(function() {
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("appWrap").style.display = "block";
    refreshConnectUI();
    render();
  });
</script>
</body>
