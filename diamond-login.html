<div class="dm-wrap" style="max-width:420px;">
  <div class="dm-panel">
    <h2 style="margin-top:0;text-align:center;">Log In</h2>
    <p class="dm-muted dm-center">Access your Diamond Method course.</p>

    <form id="login-form">
      <div class="dm-field">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="dm-field">
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <div class="dm-btn-row" style="margin-top:20px;">
        <button type="submit" class="dm-btn" id="login-button" style="width:100%;">Log In</button>
      </div>
      <div class="dm-error" id="login-status"></div>
    </form>

    <p class="dm-center dm-muted" style="margin-top:20px;font-size:.85rem;">
      Not enrolled yet? <a href="diamond-method.html" style="color:var(--blue);">Purchase the course</a>
    </p>
  </div>
</div>

<script src="diamond-course.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var password = document.getElementById('password').value;
  var statusEl = document.getElementById('login-status');
  var loginButton = document.getElementById('login-button');

  statusEl.textContent = '';
  loginButton.disabled = true;
  loginButton.textContent = 'Checking...';

  try {
    var students = await dmFetchStudents();
    var student = students.find(function (s) { return s.email === email; });
    if (!student) {
      throw new Error('No account found with that email.');
    }
    var hash = await dmSha256Hex(student.salt + password);
    if (hash !== student.passwordHash) {
      throw new Error('Incorrect password.');
    }
    dmSaveSession(email, password);
    location.href = 'diamond-course.html';
  } catch (err) {
    statusEl.textContent = err.message || 'Login failed.';
    loginButton.disabled = false;
    loginButton.textContent = 'Log In';
  }
});
</script>
