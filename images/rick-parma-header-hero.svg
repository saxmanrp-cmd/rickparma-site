<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">Rick Parma — Las Vegas entertainer</title>
  <desc id="desc">Transparent Rick Parma chrome header artwork with a central medallion, performer descriptor and neon tagline.</desc>

  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#dbe6f2"/>
      <stop offset=".38" stop-color="#77879b"/>
      <stop offset=".50" stop-color="#f7fbff"/>
      <stop offset=".67" stop-color="#8d9caf"/>
      <stop offset=".83" stop-color="#eef4fa"/>
      <stop offset="1" stop-color="#66778d"/>
    </linearGradient>
    <linearGradient id="chromeEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".22" stop-color="#7f90a7"/>
      <stop offset=".48" stop-color="#f9fcff"/>
      <stop offset=".74" stop-color="#6f8198"/>
      <stop offset="1" stop-color="#dce7f4"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35cfff"/>
      <stop offset=".35" stop-color="#4c8dff"/>
      <stop offset=".58" stop-color="#b75dff"/>
      <stop offset=".77" stop-color="#ff42dc"/>
      <stop offset="1" stop-color="#ff65cf"/>
    </linearGradient>
    <radialGradient id="medallion" cx="48%" cy="38%" r="70%">
      <stop offset="0" stop-color="#151c2a" stop-opacity=".88"/>
      <stop offset=".62" stop-color="#050810" stop-opacity=".92"/>
      <stop offset="1" stop-color="#000207" stop-opacity=".96"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="12" result="off"/>
      <feFlood flood-color="#000" flood-opacity=".72"/>
      <feComposite in2="off" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow" x="-35%" y="-150%" width="170%" height="400%">
      <feGaussianBlur stdDeviation="9" result="b1"/>
      <feGaussianBlur stdDeviation="20" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Transparent artwork: the live Vegas photo is supplied by the page behind this SVG. -->

  <!-- Empty polished medallion. The real site RP logo is overlaid by CSS in this circle. -->
  <g transform="translate(836 248)" filter="url(#shadow)">
    <circle r="182" fill="#02050b" fill-opacity=".86" stroke="#111a28" stroke-width="18"/>
    <circle r="174" fill="url(#medallion)" stroke="url(#chromeEdge)" stroke-width="11"/>
    <circle r="159" fill="none" stroke="#ffffff" stroke-opacity=".34" stroke-width="2"/>
  </g>

  <!-- Small polished highlights -->
  <g fill="#fff">
    <circle cx="933" cy="95" r="3"/>
    <circle cx="933" cy="95" r="17" opacity=".36" filter="url(#spark)"/>
    <circle cx="437" cy="485" r="3"/>
    <circle cx="437" cy="485" r="15" opacity=".30" filter="url(#spark)"/>
    <circle cx="1431" cy="642" r="3"/>
    <circle cx="1431" cy="642" r="15" opacity=".30" filter="url(#spark)"/>
  </g>

  <!-- Main chrome name -->
  <g filter="url(#shadow)">
    <text x="836" y="617"
          text-anchor="middle"
          font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-size="176"
          font-weight="900"
          letter-spacing="3"
          fill="url(#chrome)"
          stroke="#27384f"
          stroke-width="5"
          paint-order="stroke fill">RICK PARMA</text>
    <text x="836" y="617"
          text-anchor="middle"
          font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-size="176"
          font-weight="900"
          letter-spacing="3"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".42"
          stroke-width="1.6">RICK PARMA</text>
  </g>

  <!-- Performer descriptor -->
  <text x="836" y="690"
        text-anchor="middle"
        font-family="Helvetica Neue, Arial, sans-serif"
        font-size="38"
        font-weight="700"
        letter-spacing="13"
        fill="#f4f7fb"
        stroke="#05070b"
        stroke-width="2"
        paint-order="stroke fill">SINGER • SAXOPHONIST • ENTERTAINER</text>

  <!-- Neon script tagline -->
  <g filter="url(#neonGlow)">
    <text x="836" y="792"
          text-anchor="middle"
          font-family="Brush Script MT, Segoe Script, Snell Roundhand, cursive"
          font-size="86"
          font-style="italic"
          font-weight="500"
          fill="url(#neon)"
          stroke="#f7fbff"
          stroke-opacity=".46"
          stroke-width="1.2"
          paint-order="stroke fill">Bringing the Vibe. Every Time.</text>
  </g>
</svg>
