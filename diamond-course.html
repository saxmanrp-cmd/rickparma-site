<div class="dm-wrap">
  <div class="dm-top-links">
    <a href="diamond-account.html">My Account</a>
    <a href="#" id="logout-link">Log out</a>
  </div>

  <div class="dm-panel" id="loading">
    <p class="dm-muted dm-center">Loading your course...</p>
  </div>

  <div class="dm-panel" id="course-content" style="display:none;">
    <h2 style="margin-top:0;">Diamond Method</h2>
    <p class="dm-muted">Pick up where you left off, or revisit anything you've already unlocked.</p>
    <ul class="dm-toc" id="toc-list"></ul>
  </div>
</div>

<script src="diamond-course.js"></script>
<script>
(async function () {
  var auth = await dmAuthenticate();
  if (!auth) return;

  var unlocked = auth.student.unlockedUpTo || 1;
  var list = document.getElementById('toc-list');

  DM_LESSONS.forEach(function (lesson) {
    var li = document.createElement('li');
    if (lesson.index <= unlocked) {
      var a = document.createElement('a');
      a.href = lesson.slug;
      a.innerHTML = '<span class="num">' + lesson.index + '.</span> ' + lesson.title;
      li.appendChild(a);
    } else {
      var div = document.createElement('div');
      div.className = 'locked';
      div.innerHTML = '<span class="num">' + lesson.index + '.</span> ' + lesson.title + ' &mdash; locked';
      li.appendChild(div);
    }
    list.appendChild(li);
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('course-content').style.display = 'block';

  document.getElementById('logout-link').addEventListener('click', function (e) {
    e.preventDefault();
    dmClearSession();
    location.href = 'diamond-login.html';
  });
})();
</script>
